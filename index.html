<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b111b">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%230b111b'/%3E%3Cpath%20d='M7%2012l4%203%205-7%205%207%204-3-2%2012H9L7%2012z'%20fill='none'%20stroke='%23d8b166'%20stroke-width='1.6'/%3E%3C/svg%3E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>富饶之城 · 王城崛起</title>
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div id="app">
  <header class="hud">
    <div class="hud-l">
      <span id="hud-round" class="hud-round">第 0 回合</span>
      <span id="hud-phase" class="phase">准备中</span>
    </div>
    <div class="hud-r">
      <span id="hud-crown" class="crown-chip"></span>
      <button class="icon-btn" data-act="log" aria-label="对局日志">记</button>
      <button class="icon-btn" data-act="help" aria-label="规则">?</button>
    </div>
  </header>

  <section class="opponents" id="opponents"></section>
  <section class="statusbar" id="statusbar"></section>
  <section class="ticker" id="ticker"><span class="tk-tag">动态</span><span class="tk-text" id="ticker-text"></span></section>

  <section class="board" id="board">
    <div class="board-head">
      <span class="board-title" id="board-title">我的王城</span>
      <div class="view-tabs hidden" id="view-tabs"></div>
      <span class="board-meta" id="board-meta"></span>
    </div>
    <div class="city" id="city"></div>
    <div class="hint-line" id="hint-line"></div>
  </section>

  <section class="dock">
    <div class="hand-head">
      <div class="hand-left">
        <span class="hand-title" id="hand-title">手牌</span>
        <span class="role-chip" id="role-chip"></span>
      </div>
      <span class="gold-chip" id="gold-chip"></span>
    </div>
    <div class="hand" id="hand"></div>
  </section>

  <footer class="actionbar" id="actionbar"></footer>
  <div class="event-layer" id="event-layer"></div>
  <div class="toast" id="toast"></div>
</div>

<div id="overlay" class="overlay hidden"></div>
<div id="pass" class="pass-screen hidden"></div>
<div id="netroom" class="netroom hidden"></div>

<div id="start" class="start">
  <div class="start-poster" aria-hidden="true">
    <img src="assets/art/districts/castle.webp" alt=""
      srcset="assets/art/districts/castle@2x.webp 2x"
      onerror="this.style.display='none'">
    <i class="sp-veil"></i><i class="sp-ground"></i>
  </div>
  <div class="start-inner">
    <h1 class="start-title">富饶之城</h1>
    <div class="start-rule"><span></span><em>CITADELS</em><span></span></div>
    <p class="start-tagline">八位角色，五色城区。<br>猜透对手，建成最富饶的王城。</p>

    <div class="seg mode-seg" id="mode-seg">
      <button data-mode="solo" class="on">单人挑战</button>
      <button data-mode="duo">双人同屏</button>
      <button data-mode="net">局域网联机</button>
    </div>

    <div class="seg" id="count-seg">
      <button data-count="3">3 人桌</button>
      <button data-count="4" class="on">4 人桌</button>
    </div>
    <p class="mode-note" id="mode-note">你 + 3 位 AI 城主。</p>

    <button class="btn primary big" id="btn-start">开始游戏</button>
    <button class="btn ghost" id="btn-rules">规则速览</button>
    <p class="start-foot">纯本地单机 · 无需联网 · 竖屏适配</p>
  </div>
</div>

<script>
/* 联机房间服务地址：部署 server/ 后把 wrangler 给出的域名填在这里，默认值见下 */
window.CIT_NET_SERVER = new URLSearchParams(location.search).get('net') || '';
</script>
<script src="js/data.js?v=6"></script>
<script src="js/engine.js?v=6"></script>
<script src="js/ai.js?v=6"></script>
<script src="js/qrcode.js?v=6"></script>
<script src="js/net.js?v=6"></script>
<script src="js/ui.js?v=6"></script>
</body>
</html>
